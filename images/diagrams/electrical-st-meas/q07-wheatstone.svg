<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <rect width="480" height="240" fill="#fafafa"/>
  <text x="12" y="22" font-size="14">Wheatstone bridge (galvanometer G between b–d)</text>
  <circle cx="240" cy="50" r="8" fill="none" stroke="#111"/><text x="255" y="55" font-size="12">E</text>
  <line x1="240" y1="58" x2="240" y2="90" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="90" x2="340" y2="90" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="90" x2="140" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="340" y1="90" x2="340" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="180" x2="340" y2="180" stroke="#111" stroke-width="2"/>
  <text x="145" y="130" font-size="12">P</text><text x="310" y="130" font-size="12">Q</text>
  <text x="145" y="175" font-size="12">R</text><text x="310" y="175" font-size="12">S</text>
