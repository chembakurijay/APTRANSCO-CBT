<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Q9 — Symmetrical components (read figure)</text>
  
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Open-conductor fault — phase currents on figure</text>
  <circle cx="200" cy="180" r="90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Ia -->
  <line x1="200" y1="180" x2="340" y2="180" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="300" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1d4ed8" font-weight="700">Ia = 10∠0°</text>
  <!-- Ib -->
  <line x1="200" y1="180" x2="60" y2="180" stroke="#b91c1c" stroke-width="4"/>
  <text x="40" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b91c1c" font-weight="700">Ib = 10∠180°</text>
  <!-- Ic -->
  <circle cx="200" cy="180" r="6" fill="#0f172a"/>
  <text x="210" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">Ic = 0</text>
  <text x="400" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Find Ia⁰ = (Ia+Ib+Ic)/3</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

</svg>
