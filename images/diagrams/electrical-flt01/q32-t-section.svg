<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <rect width="560" height="320" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#0f172a">Two-port T-section</text>
  <!-- ports -->
  <circle cx="60" cy="110" r="4" fill="#0f172a"/><text x="48" y="98" font-size="14" font-family="Segoe UI,sans-serif">1</text>
  <circle cx="60" cy="250" r="4" fill="#0f172a"/><text x="44" y="270" font-size="14" font-family="Segoe UI,sans-serif">1'</text>
  <circle cx="500" cy="110" r="4" fill="#0f172a"/><text x="506" y="98" font-size="14" font-family="Segoe UI,sans-serif">2</text>
  <circle cx="500" cy="250" r="4" fill="#0f172a"/><text x="506" y="270" font-size="14" font-family="Segoe UI,sans-serif">2'</text>
  <!-- series Z1 -->
  <line x1="60" y1="110" x2="140" y2="110" stroke="#0f172a" stroke-width="2"/>
  <rect x="140" y="95" width="80" height="30" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-size="14" font-family="Segoe UI,sans-serif">Z1</text>
  <line x1="220" y1="110" x2="280" y2="110" stroke="#0f172a" stroke-width="2"/>
  <!-- series Z2 -->
  <line x1="280" y1="110" x2="340" y2="110" stroke="#0f172a" stroke-width="2"/>
  <rect x="340" y="95" width="80" height="30" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" font-size="14" font-family="Segoe UI,sans-serif">Z2</text>
  <line x1="420" y1="110" x2="500" y2="110" stroke="#0f172a" stroke-width="2"/>
  <!-- shunt Z3 -->
  <line x1="280" y1="110" x2="280" y2="160" stroke="#0f172a" stroke-width="2"/>
  <rect x="265" y="160" width="30" height="50" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="190" font-size="14" font-family="Segoe UI,sans-serif">Z3</text>
  <line x1="280" y1="210" x2="280" y2="250" stroke="#0f172a" stroke-width="2"/>
  <!-- common -->
  <line x1="60" y1="250" x2="500" y2="250" stroke="#0f172a" stroke-width="2"/>
  <text x="280" y="300" text-anchor="middle" font-size="13" font-family="Segoe UI,sans-serif" fill="#334155">If Z1 ≠ Z2 → unsymmetrical T; if Z1 = Z2 → symmetrical T</text>
</svg>
