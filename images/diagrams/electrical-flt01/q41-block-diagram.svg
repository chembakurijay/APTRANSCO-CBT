<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#f8fafc"/>
  <text x="280" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#0f172a">Closed-loop system</text>

  <!-- R -->
  <text x="24" y="118" font-family="Segoe UI,sans-serif" font-size="16">R(s)</text>
  <line x1="70" y1="112" x2="120" y2="112" stroke="#0f172a" stroke-width="2"/>
  <!-- summer -->
  <circle cx="140" cy="112" r="20" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="132" y="108" font-size="14" font-family="Segoe UI,sans-serif">+</text>
  <text x="148" y="128" font-size="14" font-family="Segoe UI,sans-serif">−</text>
  <!-- E -->
  <line x1="160" y1="112" x2="220" y2="112" stroke="#0f172a" stroke-width="2"/>
  <text x="175" y="100" font-family="Segoe UI,sans-serif" font-size="15" fill="#b91c1c">E(s)</text>
  <!-- G -->
  <rect x="220" y="88" width="90" height="48" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="255" y="118" font-family="Segoe UI,sans-serif" font-size="18">G</text>
  <line x1="310" y1="112" x2="420" y2="112" stroke="#0f172a" stroke-width="2"/>
  <text x="430" y="118" font-family="Segoe UI,sans-serif" font-size="16">C(s)</text>
  <!-- feedback takeoff -->
  <circle cx="380" cy="112" r="3" fill="#0f172a"/>
  <line x1="380" y1="112" x2="380" y2="220" stroke="#0f172a" stroke-width="2"/>
  <rect x="250" y="200" width="90" height="40" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="282" y="226" font-family="Segoe UI,sans-serif" font-size="18" fill="#b91c1c">H</text>
  <line x1="250" y1="220" x2="140" y2="220" stroke="#0f172a" stroke-width="2"/>
  <line x1="140" y1="220" x2="140" y2="132" stroke="#0f172a" stroke-width="2"/>

  <text x="280" y="300" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#334155">Find E(s)/R(s)  (not C/R)</text>
</svg>
