<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400">
  <rect width="480" height="400" fill="#f8fafc"/>
  <text x="240" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#0f172a">Parallel-plate capacitor — dielectric fill</text>

  <text x="40" y="64" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600">(a) Air only → C0</text>
  <rect x="80" y="80" width="18" height="110" fill="#64748b"/>
  <rect x="200" y="80" width="18" height="110" fill="#64748b"/>
  <text x="120" y="140" font-family="Segoe UI,sans-serif" font-size="14" fill="#334155">air</text>
  <text x="85" y="210" font-family="Segoe UI,sans-serif" font-size="12" fill="#64748b">plates</text>

  <text x="40" y="250" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600">(b) Half gap filled εr (side-by-side)</text>
  <rect x="80" y="270" width="18" height="110" fill="#64748b"/>
  <rect x="200" y="270" width="18" height="110" fill="#64748b"/>
  <!-- left half air, right half dielectric between plates -->
  <rect x="98" y="270" width="51" height="110" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="112" y="332" font-family="Segoe UI,sans-serif" font-size="13" fill="#475569">air</text>
  <rect x="149" y="270" width="51" height="110" fill="#93c5fd" stroke="#1d4ed8"/>
  <text x="158" y="332" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e3a8a">εr</text>

  <text x="250" y="320" font-family="Segoe UI,sans-serif" font-size="13" fill="#334155">⇒ two capacitors in parallel:</text>
  <text x="250" y="342" font-family="Segoe UI,sans-serif" font-size="13" fill="#334155">C = (C0/2) + εr(C0/2)</text>
</svg>
