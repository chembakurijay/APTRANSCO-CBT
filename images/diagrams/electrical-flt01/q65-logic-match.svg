<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <rect width="720" height="260" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Q65 — Logic gate matching</text>
  
  <text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="14">Match gate symbols (List-I) to expressions</text>

  <rect x="60" y="70" width="140" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="105" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">NAND</text>
  <text x="100" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">¬(A·B)</text>
  <circle cx="130" cy="165" r="12" fill="none" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="220" y="70" width="140" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="265" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">NOR</text>
  <text x="260" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">¬(A+B)</text>
  <circle cx="290" cy="165" r="12" fill="none" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="380" y="70" width="140" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="425" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">XOR</text>
  <text x="420" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">A⊕B</text>
  <circle cx="450" cy="165" r="12" fill="none" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="540" y="70" width="140" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="585" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">AND</text>
  <text x="580" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">A·B</text>
  <circle cx="610" cy="165" r="12" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<text x="40" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Select the correct matching code from options</text>
</svg>
