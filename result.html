<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Result - APTRANSCO CBT</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="page-shell result-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">APTRANSCO AEE</p>
                <h1>Exam Result</h1>
            </div>
        </header>

        <section class="content-card">
            <div class="result-summary">
                <div class="summary-item">
                    <h2 id="totalQuestions">100</h2>
                    <p>Total Questions</p>
                </div>
                <div class="summary-item">
                    <h2 id="attemptedQuestions">0</h2>
                    <p>Attempted</p>
                </div>
                <div class="summary-item">
                    <h2 id="notAttemptedQuestions">0</h2>
                    <p>Not Attempted</p>
                </div>
                <div class="summary-item">
                    <h2 id="correctAnswers">0</h2>
                    <p>Correct</p>
                </div>
                <div class="summary-item">
                    <h2 id="wrongAnswers">0</h2>
                    <p>Wrong</p>
                </div>
            </div>

            <div class="score-card">
                <p>Score</p>
                <h2 id="finalScore">0</h2>
                <p id="percentageScore">0%</p>
                <p id="timeTaken">Time Taken: 0m 0s</p>
            </div>

            <div class="actions-row">
                <a class="button button-secondary" href="index.html">Return Home</a>
                <button class="button button-primary" id="reviewAnswersButton" type="button">Review Answers</button>
            </div>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
