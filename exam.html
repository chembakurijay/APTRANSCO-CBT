<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam - APTRANSCO CBT</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/exam.css" />
</head>
<body>
    <main class="page-shell exam-page">
        <header class="exam-header">
            <div class="candidate-info">
                <p class="label">Candidate</p>
                <h2>APTRANSCO AEE Mock Exam</h2>
            </div>
            <div class="timer-panel" aria-live="polite">
                <span class="label">Time Remaining</span>
                <div id="countdown" class="timer-display">03:00:00</div>
            </div>
        </header>

        <section class="exam-body">
            <article class="question-card">
                <div class="question-top">
                    <span id="questionStatus" class="question-status">Question 1 of 100</span>
                    <div id="questionText" class="question-text">Loading question...</div>
                </div>
                <div id="questionMedia" class="question-media"></div>
                <div id="optionsList" class="options-list"></div>
            </article>

            <aside class="palette-panel">
                <div class="palette-header">
                    <h3>Question Palette</h3>
                    <p>Jump to any question</p>
                </div>
                <div id="questionPalette" class="question-palette"></div>
                <div class="calculator-panel">
                    <h3>Engineering Calculator</h3>
                    <div id="calculator"></div>
                </div>
            </aside>
        </section>

        <footer class="exam-footer">
            <div class="footer-actions">
                <button class="button button-secondary" id="previousButton" type="button">Previous</button>
                <button class="button button-secondary" id="clearButton" type="button">Clear Response</button>
                <button class="button button-secondary" id="reviewButton" type="button">Mark for Review & Next</button>
                <button class="button button-primary" id="saveNextButton" type="button">Save & Next</button>
                <button class="button button-primary" id="nextButton" type="button">Next</button>
            </div>
            <button class="button button-danger" id="submitButton" type="button">Submit Exam</button>
        </footer>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
